services:
  backend:
    image: chetan1818/idurar-backend:${TAG}
    container_name: idurar-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URI=your_mongodb_connection_string_here
      - PORT=8080
  
  frontend:
    image: chetan1818/idurar-frontend:${TAG}
    container_name: idurar-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080
    depends_on:
      - backend